<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 406" width="1040" height="406" role="img" aria-label="Four biological data sources feed one multimodal and multiscale AI model, which returns two probabilities: the chance of a specific molecular initiating event, and the chance that the hepatocyte tips to z-adversity instead of returning to z-homeostasis.">
