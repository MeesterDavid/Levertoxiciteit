[project]
name = "levertoxiciteit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "marimo>=0.25.2",
    "matplotlib>=3.10.9",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "rdkit>=2026.9.1",
    "requests>=2.34.2",
    "scipy>=1.15.3",
    "torch>=2.11.0",
    "torchdiffeq>=0.2.5",
    "torchvision>=0.26.0",
    "transformers>=4.40.0,<5.0.0",
]

[project.scripts]
levertoxiciteit = "levertoxiciteit:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
